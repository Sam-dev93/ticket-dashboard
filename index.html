<meta name="mobile-web-app-capable" content="yes">

<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">

<script defer src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script>
  // Apply the saved appearance before first paint (no flash)
  (function () {
    try {
      var p = localStorage.getItem('theme');
      if (p === 'light' || p === 'dark') document.documentElement.setAttribute('data-theme', p);
    } catch (e) {}
  })();
</script>
<style>
:root {
  --bg: #F2F2F7;
  --card: #FFFFFF;
  --label: #000000;
  --sec: #8A8A8E;
  --chev: #C4C4C7;
  --sep: #E3E3E8;
  --fill: rgba(118,118,128,0.12);
  --track: #E9E9EE;
  --red: #FF383C;
  --orange: #FF8D28;
  --green: #34C759;
  --blue: #0088FF;
  --indigo: #6155F5;
  --teal: #00C3D0;
  --purple: #CB30E0;
  --glass: rgba(255,255,255,0.72);
  --g-border: rgba(0,0,0,0.06);
  --g-shadow: inset 0 1px 0 rgba(255,255,255,0.9), 0 8px 28px rgba(0,0,0,0.10);
  --seg-on: #FFFFFF;
  --seg-sh: 0 2px 6px rgba(0,0,0,0.12);
  --wash-top: #5FD3A0;
  --wash: linear-gradient(180deg, #5FD3A0 0%, #A8E6C6 38%, #DCF3E6 66%, rgba(242,242,247,0) 100%);
  --sheet-card: #FFFFFF;
  --ring-bg: #1C1C1E;
  --fade: linear-gradient(to bottom, rgba(242,242,247,0), rgba(242,242,247,0.75));
  --edge: rgba(242,242,247,0.85);
  --pill: rgba(118,118,128,0.14);
  --backdrop: rgba(0,0,0,0.25);
  --sheet: #F2F2F7;
  --grab: #C7C7CC;
  color-scheme: light;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", system-ui, "Segoe UI", sans-serif;
  --rounded: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
  --bg: #000000;
  --card: #1C1C1E;
  --label: #FFFFFF;
  --sec: #98989F;
  --chev: #5A5A5F;
  --sep: #38383A;
  --fill: rgba(118,118,128,0.24);
  --track: #2C2C2E;
  --red: #E0605A;
  --orange: #DB8A4A;
  --green: #4CB872;
  --blue: #4A8FE0;
  --indigo: #7F86E0;
  --teal: #3FB3BE;
  --purple: #B96AD0;
  --glass: rgba(44,44,48,0.72);
  --g-border: rgba(255,255,255,0.12);
  --g-shadow: inset 0 1px 0 rgba(255,255,255,0.14), 0 8px 28px rgba(0,0,0,0.5);
  --seg-on: #636366;
  --seg-sh: none;
  --wash-top: #0B3A28;
  --wash: linear-gradient(180deg, #0B3A28 0%, #08291D 36%, #041610 66%, rgba(0,0,0,0) 100%);
  --sheet-card: #2C2C2E;
  --ring-bg: #000000;
  --fade: linear-gradient(to bottom, rgba(0,0,0,0), rgba(0,0,0,0.75));
  --edge: rgba(0,0,0,0.85);
  --pill: rgba(0,0,0,0.40);
  --backdrop: rgba(0,0,0,0.5);
  --sheet: #1C1C1E;
  --grab: #48484A;
  color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #000000;
  --card: #1C1C1E;
  --label: #FFFFFF;
  --sec: #98989F;
  --chev: #5A5A5F;
  --sep: #38383A;
  --fill: rgba(118,118,128,0.24);
  --track: #2C2C2E;
  --red: #E0605A;
  --orange: #DB8A4A;
  --green: #4CB872;
  --blue: #4A8FE0;
  --indigo: #7F86E0;
  --teal: #3FB3BE;
  --purple: #B96AD0;
  --glass: rgba(44,44,48,0.72);
  --g-border: rgba(255,255,255,0.12);
  --g-shadow: inset 0 1px 0 rgba(255,255,255,0.14), 0 8px 28px rgba(0,0,0,0.5);
  --seg-on: #636366;
  --seg-sh: none;
  --wash-top: #0B3A28;
  --wash: linear-gradient(180deg, #0B3A28 0%, #08291D 36%, #041610 66%, rgba(0,0,0,0) 100%);
  --sheet-card: #2C2C2E;
  --ring-bg: #000000;
  --fade: linear-gradient(to bottom, rgba(0,0,0,0), rgba(0,0,0,0.75));
  --edge: rgba(0,0,0,0.85);
  --pill: rgba(0,0,0,0.40);
  --backdrop: rgba(0,0,0,0.5);
  --sheet: #1C1C1E;
  --grab: #48484A;
  color-scheme: dark;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; background: var(--bg); }
html.home-top { background: var(--wash-top); }
body {
  font-family: var(--font); color: var(--label);
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%;
  user-select: none; -webkit-user-select: none; touch-action: manipulation;
}
button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; padding: 0; text-align: inherit; }
button:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
button:disabled { cursor: default; }
.press { transition: transform .15s ease, opacity .15s ease; }
.press:active { transform: scale(0.97); opacity: 0.85; }
.num { font-variant-numeric: tabular-nums; }
.hidden { display: none !important; }

/* ---------- Views ---------- */
#app { position: fixed; inset: 0; overflow: hidden; overflow: clip; background: var(--bg); }
.view { position: absolute; inset: 0; display: none; background: var(--bg); }
.view.active { display: block; }
.scroll { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; overscroll-behavior-y: contain; }
.page {
  position: relative; max-width: 560px; margin: 0 auto;
  padding: calc(var(--safe-top) + 60px) 16px calc(var(--safe-bottom) + 112px);
  display: flex; flex-direction: column; gap: 14px;
}
.wash { position: absolute; left: 0; right: 0; top: 0; height: calc(var(--safe-top) + 470px); background: var(--wash); pointer-events: none; }
.view.push { z-index: 10; display: block; visibility: hidden; transform: translateX(100%); transition: transform .38s cubic-bezier(.2,.9,.3,1), visibility 0s linear .38s; }
.view.push.open { visibility: visible; transform: none; transition: transform .38s cubic-bezier(.2,.9,.3,1); }

/* ---------- Floating nav (Liquid Glass controls) ---------- */
.nav {
  position: absolute; z-index: 6; left: 0; right: 0; top: 0;
  padding: calc(var(--safe-top) + 6px) 16px 10px;
  display: flex; align-items: center; justify-content: space-between; gap: 8px; pointer-events: none;
}
.nav > * { pointer-events: auto; }
.nav::before {
  content: ""; position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity .2s ease;
  background: linear-gradient(to bottom, var(--edge) 0%, var(--edge) 55%, transparent 100%);
  -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  -webkit-mask-image: linear-gradient(to bottom, #000 55%, transparent); mask-image: linear-gradient(to bottom, #000 55%, transparent);
}
.view.scrolled .nav::before { opacity: 1; }
.ctitle {
  position: absolute; left: 76px; right: 76px; top: calc(var(--safe-top) + 6px); height: 44px; line-height: 44px;
  text-align: center; font-size: 17px; font-weight: 600; opacity: 0; transition: opacity .2s ease; pointer-events: none;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.view.scrolled .ctitle { opacity: 1; }
.nav-group { display: flex; gap: 8px; }
.glass {
  background: var(--glass); border: 1px solid var(--g-border); box-shadow: var(--g-shadow);
  -webkit-backdrop-filter: blur(20px) saturate(180%); backdrop-filter: blur(20px) saturate(180%);
}
.circ { width: 44px; height: 44px; border-radius: 999px; display: flex; align-items: center; justify-content: center; color: var(--label); flex-shrink: 0; }
.pillgroup { display: flex; padding: 0 4px; border-radius: 999px; }
.pillgroup button { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: var(--label); }
.pillgroup button.on { color: var(--blue); }
.spin svg { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- Type ---------- */
h1.large { font-size: 34px; font-weight: 700; letter-spacing: 0.3px; line-height: 1.15; padding: 0 6px; }
.sub { font-size: 15px; color: var(--sec); padding: 0 6px; margin-top: -10px; }
.shead { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 6px 0; }
.shead h2 { font-size: 22px; font-weight: 700; flex: 1; }
.shead .r { font-size: 17px; color: var(--sec); }
.shead .link { font-size: 17px; color: var(--blue); display: flex; align-items: center; gap: 4px; }
.shead .ic { display: flex; }
.day { font-size: 20px; font-weight: 700; padding: 8px 6px 0; }

/* ---------- Cards & lists ---------- */
.card { background: var(--card); border-radius: 26px; }
.cardpad { padding: 16px 16px 18px; display: flex; flex-direction: column; gap: 12px; width: 100%; text-align: left; }
.list { background: var(--card); border-radius: 26px; overflow: hidden; }
.row { position: relative; display: flex; align-items: center; gap: 12px; padding: 0 14px 0 16px; min-height: 62px; width: 100%; text-align: left; }
button.row:active, .row.tap:active { background: var(--fill); }
.row::after { content: ""; position: absolute; left: 64px; right: 0; bottom: 0; height: 1px; background: var(--sep); }
.row:last-child::after { display: none; }
.row.plain::after { left: 16px; }
.row.tiled { min-height: 52px; gap: 14px; }
.row.tiled::after { left: 60px; }
.row .main { flex: 1; min-width: 0; padding: 9px 0; }
.row .t { font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .s { font-size: 14px; color: var(--sec); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .v { font-size: 17px; color: var(--sec); white-space: nowrap; }
.row .right { text-align: right; flex-shrink: 0; }
.row .right b { display: block; font-size: 17px; font-weight: 600; }
.row .right small { display: block; font-size: 13px; color: var(--sec); }
.chev { color: var(--chev); display: flex; flex-shrink: 0; }
.soldout { display: flex; align-items: center; gap: 3px; font-size: 15px; font-weight: 600; color: var(--green); white-space: nowrap; }
.bar { height: 4px; border-radius: 999px; background: var(--track); overflow: hidden; margin-top: 6px; }
.bar i { display: block; height: 100%; border-radius: 999px; }
.empty { padding: 22px 18px; text-align: center; color: var(--sec); font-size: 15px; line-height: 1.45; }

.badge { width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 11px; font-weight: 800; letter-spacing: 0.3px; }
.badge.edge { box-shadow: inset 0 0 0 1px rgba(0,0,0,0.12); }
.badge.xl { width: 76px; height: 76px; border-radius: 22px; font-size: 20px; }
.tile { --c: var(--blue); width: 30px; height: 30px; border-radius: 8px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  background: linear-gradient(180deg, color-mix(in srgb, var(--c) 78%, white), var(--c)); color: #FFFFFF; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .tile { background: #121214; color: var(--c); border: 1px solid rgba(255,255,255,0.07); } }
:root[data-theme="dark"] .tile { background: #121214; color: var(--c); border: 1px solid rgba(255,255,255,0.07); }

.chead { display: flex; align-items: center; gap: 6px; }
.chead .ic { display: flex; }
.chead .ct { flex: 1; font-size: 17px; font-weight: 600; }
.chead .cr { font-size: 15px; color: var(--sec); }
.cols { display: flex; align-items: stretch; }
.cols > div + div { border-left: 1px solid var(--sep); padding-left: 12px; margin-left: 12px; }
.cols .l { font-size: 15px; font-weight: 600; }
.cols .v {  font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.cols.sm .l { font-size: 13px; }
.cols.sm .v { font-size: 17px; }
.big {  font-size: 36px; font-weight: 600; letter-spacing: -0.6px; font-variant-numeric: tabular-nums; line-height: 1.15; }
.muted { font-size: 15px; color: var(--sec); }
.split { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }

.ring { position: relative; width: 68px; height: 68px; border-radius: 50%; background: var(--ring-bg); flex-shrink: 0; }
.ring svg { transform: rotate(-90deg); }
.ring b { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #FFFFFF; font-size: 13px; font-weight: 700; }
.minibars { display: flex; align-items: flex-end; gap: 4px; height: 44px; flex-shrink: 0; }
.minibars i { width: 6px; border-radius: 3px; background: var(--track); }
.segs { display: flex; gap: 3px; }
.segs i { flex: 1; height: 8px; border-radius: 999px; background: var(--track); }

/* segmented control */
.seg { display: flex; padding: 3px; border-radius: 999px; background: var(--fill); }
.seg button { text-align: center; flex: 1; height: 34px; border-radius: 999px; font-size: 14px; font-weight: 500; transition: background .2s ease; }
.seg button[aria-pressed="true"] { background: var(--seg-on); box-shadow: var(--seg-sh); font-weight: 600; }

/* search */
.search { display: none; align-items: center; gap: 8px; height: 44px; border-radius: 999px; padding: 0 8px 0 14px; background: var(--fill); color: var(--sec); }
.search.show { display: flex; }
.search input { flex: 1; min-width: 0; border: none; background: none; font: inherit; font-size: 17px; color: var(--label); outline: none; user-select: text; -webkit-user-select: text; }
.search button { width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; color: var(--sec); }

/* menu */
.menu { position: absolute; z-index: 30; right: 16px; top: calc(var(--safe-top) + 58px); min-width: 230px; border-radius: 22px; padding: 6px; display: none; flex-direction: column; }
.menu.show { display: flex; animation: pop .18s ease; }
.menu button { display: flex; align-items: center; justify-content: space-between; gap: 12px; height: 44px; padding: 0 12px; border-radius: 14px; font-size: 17px; }
.menu button:active { background: var(--fill); }
.menu .tick { color: var(--blue); display: flex; }
@keyframes pop { from { opacity: 0; transform: scale(.94); } to { opacity: 1; transform: none; } }

/* team header */
.team-hero { display: flex; flex-direction: column; align-items: center; gap: 8px; padding-bottom: 4px; text-align: center; }
.team-hero h1 { font-size: 28px; font-weight: 700; }
.team-hero p { margin-top: -6px; font-size: 15px; color: var(--sec); }

/* month chart */
.chart { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); align-items: end; height: 118px; }
.chart button { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 6px; height: 100%; }
.chart i { display: block; width: 12px; border-radius: 6px; background: var(--track); }
.chart span { font-size: 12px; color: var(--sec); }
.chart button[aria-pressed="true"] span { color: var(--label); font-weight: 700; }

/* ---------- Tab bar ---------- */
.bottom-fade { position: fixed; z-index: 15; left: 0; right: 0; bottom: 0; height: calc(var(--safe-bottom) + 90px); background: var(--fade); pointer-events: none; }
.tabbar {
  position: fixed; z-index: 20; left: 0; right: 0; margin: 0 auto;
  bottom: max(10px, calc(var(--safe-bottom) - 10px));
  width: min(calc(100% - 40px), 440px); height: 62px; border-radius: 999px;
  display: flex; align-items: center; padding: 0 4px;
}
.tab-pill { position: absolute; left: 4px; top: 4px; bottom: 4px; width: calc((100% - 8px) / 4); border-radius: 999px; background: var(--pill); transform: translateX(calc(var(--i, 0) * 100%)); transition: transform .45s cubic-bezier(.3,1.3,.45,1); }
.tab { position: relative; z-index: 1; flex: 1; height: 54px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 10px; font-weight: 600; color: var(--label); }
.tab[aria-selected="true"] { color: var(--blue); }

/* ---------- Sheets ---------- */
.layer { position: fixed; inset: 0; z-index: 40; pointer-events: none; visibility: hidden; transition: visibility 0s linear .38s; }
.layer.open { pointer-events: auto; visibility: visible; transition: none; }
.backdrop { position: absolute; inset: 0; background: var(--backdrop); opacity: 0; transition: opacity .3s ease; }
.layer.open .backdrop { opacity: 1; }
.sheet {
  position: absolute; left: 8px; right: 8px; margin: 0 auto; max-width: 560px;
  top: calc(var(--safe-top) + 12px); bottom: 8px;
  border-radius: 38px; background: var(--sheet); display: flex; flex-direction: column; overflow: hidden;
  box-shadow: 0 -8px 40px rgba(0,0,0,0.25);
  transform: translateY(110%); transition: transform .38s cubic-bezier(.2,.9,.3,1);
}
.sheet.medium { top: auto; max-height: calc(100% - var(--safe-top) - 40px); }
.layer.open .sheet { transform: none; }
.sheet.dragging { transition: none; }
.sheet-head { padding: 8px 16px 8px; flex-shrink: 0; touch-action: none; }
.grab { width: 36px; height: 5px; border-radius: 999px; background: var(--grab); margin: 0 auto 8px; }
.sh-row { display: flex; align-items: center; gap: 10px; }
.sh-title { flex: 1; text-align: center; min-width: 0; }
.sh-title b { display: block; font-size: 17px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sh-title span { display: block; font-size: 13px; color: var(--sec); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sheet-body { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 6px 16px calc(18px + var(--safe-bottom)); display: flex; flex-direction: column; gap: 14px; }
.sheet .card, .sheet .list { background: var(--sheet-card); }
.months { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.months button { text-align: center; height: 46px; border-radius: 999px; background: var(--sheet-card); font-size: 16px; }
.months button[aria-pressed="true"] { background: var(--blue); color: #FFFFFF; font-weight: 600; }
.btn-primary { width: 100%; height: 54px; border-radius: 999px; background: var(--blue); color: #FFFFFF; font-size: 17px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: inset 0 1px 0 rgba(255,255,255,0.3); }
.btn-primary:disabled { opacity: 0.4; }
.btn-small { height: 36px; padding: 0 16px; border-radius: 999px; background: var(--blue); color: #FFFFFF; font-size: 15px; font-weight: 600; }
.loading-box { padding: 48px 0; display: flex; flex-direction: column; align-items: center; gap: 14px; color: var(--sec); font-size: 15px; text-align: center; }
.spinner { width: 28px; height: 28px; border-radius: 50%; border: 3px solid var(--track); border-top-color: var(--sec); animation: spin .8s linear infinite; }

/* ---------- Status ---------- */
.progress { display: none; padding: 0 6px; }
body.loading .progress { display: block; }
.progress .track { height: 4px; border-radius: 999px; background: var(--fill); overflow: hidden; }
.progress i { display: block; height: 100%; width: 0; border-radius: 999px; background: var(--blue); transition: width .3s ease; }
.progress p { font-size: 13px; color: var(--sec); margin-top: 6px; }
#statusMessages { display: flex; flex-direction: column; gap: 10px; }
#statusMessages:empty { display: none; }
.banner { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; font-size: 14px; line-height: 1.45; width: 100%; text-align: left; }
.banner .ic { color: var(--red); display: flex; padding-top: 1px; }
.banner small { display: block; margin-top: 6px; color: var(--sec); }
.toast {
  position: fixed; z-index: 60; left: 50%; top: calc(var(--safe-top) + 8px);
  transform: translate(-50%, -150%); transition: transform .35s cubic-bezier(.2,.9,.3,1);
  border-radius: 999px; padding: 0 8px 0 18px; min-height: 48px; font-size: 15px; font-weight: 600;
  display: flex; gap: 10px; align-items: center; max-width: calc(100% - 32px); white-space: nowrap;
}
.toast.show { transform: translate(-50%, 0); }
.toast span { overflow: hidden; text-overflow: ellipsis; padding-right: 10px; }
.toast button { color: var(--blue); font-weight: 600; padding: 0 10px; height: 40px; }
.offline-pill { display: none; position: fixed; z-index: 16; left: 50%; transform: translateX(-50%); top: calc(var(--safe-top) + 10px); height: 36px; padding: 0 14px; border-radius: 999px; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: var(--sec); white-space: nowrap; }
body.offline .offline-pill { display: flex; }

        function formatCurrency(amount) {

        function formatDate(dateStr) {
            const [day, month, year] = dateStr.split('/');
            const date = new Date(year, month - 1, day);
            return date.toLocaleDateString('en-GB', { 
                day: 'numeric', 
                month: 'short' 
            });
        }
        
        function isWithinPeriod(dateStr, days) {
            const [day, month, year] = dateStr.split('/');
            const matchDate = new Date(year, month - 1, day);
            const today = new Date();
            const periodEndDate = new Date(today.getTime() + (days - 1) * 24 * 60 * 60 * 1000);
            
            const matchDateOnly = new Date(matchDate.getFullYear(), matchDate.getMonth(), matchDate.getDate());
            const todayOnly = new Date(today.getFullYear(), today.getMonth(), today.getDate());
            const endDateOnly = new Date(periodEndDate.getFullYear(), periodEndDate.getMonth(), periodEndDate.getDate());
            
            return matchDateOnly >= todayOnly && matchDateOnly <= endDateOnly;
        }
        
        function isWithinNextWeek(dateStr) {

        function formatName(name) {
            if (!name) return '';
            
            name = name.replace(/\s+BOUGHT\s+\d{2}-\d{2}$/i, '').trim();
            name = name.replace(/\s+BOUGHT\s+\d{4}$/i, '').trim();
            
            const words = name.split(/\s+/);
            
            const formattedWords = words.map(word => {
                if (word.includes('.')) {
                    return word.split('.').map(part => formatSingleWord(part)).join('.');
                }
                
                return formatSingleWord(word);
            });
            
            return formattedWords.join(' ');
        }
        
        function formatSingleWord(word) {
            if (!word) return '';
            
            const upperCaseWords = [
                'FC', 'AFC', 'RFC', 'LFC', 'CFC', 'MUFC', 'MCFC', 'NUFC', 'QPR', 'MK',
                'NFL', 'NHL', 'NBA', 'MLB', 'UTD', 'ENG', 'SCOT', 'INT', 'UK', 'US', 'USA',
                'TV', 'BBC', 'ITV', 'SKY', 'BT', 'UEFA', 'FIFA', 'FA', 'PL', 'EFL',
                'UEFA', 'FIFA', 'VAR', 'PSG', 'AC', 'AS', 'SS', 'CF', 'CD', 'SD', 'UD'
            ];
            
            const lowerCaseWords = ['v', 'vs', 'versus', 'and', 'the', 'of', 'at', 'in', 'on', 'for', 'with'];
            
            const upperWord = word.toUpperCase();
            const lowerWord = word.toLowerCase();
            
            if (upperCaseWords.includes(upperWord)) {
                return upperWord;
            }
            
            if (lowerCaseWords.includes(lowerWord)) {
                return lowerWord;
            }
            
            return word.charAt(0).toUpperCase() + word.slice(1).toLowerCase();

        async function fastFetch(url, timeout = 5000, maxRetries = 2) {
            for (let attempt = 1; attempt <= maxRetries; attempt++) {
                try {
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), timeout);
                    
                    const response = await fetch(url, { 
                        signal: controller.signal,
                        cache: 'no-cache',
                        mode: 'cors'
                    });
                    clearTimeout(timeoutId);
                    
                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}`);
                    }
                    
                    return await response.json();
                } catch (error) {
                    if (attempt === maxRetries) {
                        throw error;
                    }
                    const waitTime = error.message.includes('429') ? 2000 : 500;
                    await new Promise(resolve => setTimeout(resolve, waitTime));
                }
            }
        }

                } else if (cell === 'TOTAL SALES') {
                    totalSales = parseFloat(value.replace(/[£,]/g, '')) || 0;
                } else if (cell === 'MAS PROFIT') {
                    netProfit = parseFloat(value.replace(/[£,]/g, '')) || 0;
                }
            }
            
            if (totalTickets === 0 && totalSpent === 0) {
                return null;
            }
            
            const matches = [];
            
            for (let i = 11; i < rows.length; i++) {
                const row = rows[i];
                if (!row || !row[1]) continue;
                
                const matchName = row[1].toString().trim();
                
                if (matchName === '' || matchName.toLowerCase().includes('match')) continue;
                
                if (matchName.length > 3) {
                    const matchDate = row[2] ? row[2].toString().trim() : '01/08/2025';
                    
                    const ticketsCell = row[3] ? row[3].toString().trim() : '';
                    let availableTickets = 0;
                    let totalTickets = 0;
                    
                    if (ticketsCell.includes('/')) {
                        const parts = ticketsCell.split('/');
                        availableTickets = parseInt(parts[0]) || 0;
                        totalTickets = parseInt(parts[1]) || 0;
                    } else {
                        availableTickets = parseInt(ticketsCell.replace(/[^\d]/g, '')) || 0;
                        totalTickets = availableTickets;
                    }
                    
                    const spent = parseFloat(row[4]?.toString().replace(/[£,]/g, '')) || 0;
                    const sales = parseFloat(row[5]?.toString().replace(/[£,]/g, '')) || 0;
                    const profit = parseFloat(row[7]?.toString().replace(/[£,]/g, '')) || (sales - spent);
                    
                    if (totalTickets > 0 || spent > 0) {
                        const soldTickets = totalTickets - availableTickets;
                        
                        matches.push({
                            name: matchName,
                            date: matchDate,
                            tickets: availableTickets,
                            total: totalTickets,
                            sold: soldTickets,
                            spent: spent,
                            sales: sales,
                            profit: profit
                        });
                    }
                }
            }
            
            let teamName = documentTitle || sheetName;
            
            teamName = formatTeamName(teamName);
            
            return {
                name: teamName,
                emoji: getTeamEmoji(teamName),
                totalTickets: totalTickets,
                totalSpent: totalSpent,
                totalSales: totalSales,
                netProfit: netProfit,
                matches: matches
            };
        }

        async function loadMatchDetails(sheetId, matchName) {
            try {

                const documentInfo = await getDocumentInfo(sheetId);
                const sheets = documentInfo.sheets || [];
                
                console.log(`📋 Available sheets:`, sheets.map(s => s.properties.title));
                
                let matchSheetName = null;
                const searchName = matchName.toLowerCase().trim();
                
                const matchingStrategies = [
                    (sheetTitle) => sheetTitle.toLowerCase() === searchName,
                    
                    (sheetTitle) => sheetTitle.toLowerCase().includes(searchName),
                    
                    (sheetTitle) => searchName.includes(sheetTitle.toLowerCase()),
                    
                    (sheetTitle) => sheetTitle.toLowerCase().replace(/\s+/g, '').includes(searchName.replace(/\s+/g, '')),
                    
                    (sheetTitle) => {
                        const cleanSheet = sheetTitle.toLowerCase().replace(/\b(vs|v|against|home|away)\b/g, '').trim();
                        const cleanMatch = searchName.replace(/\b(vs|v|against|home|away)\b/g, '').trim();
                        return cleanSheet.includes(cleanMatch) || cleanMatch.includes(cleanSheet);
                    },
                    
                    (sheetTitle) => {
                        const teamNames = ['arsenal', 'spurs', 'tottenham', 'utd', 'united', 'city', 'liverpool', 'chelsea'];
                        const sheetTeams = teamNames.filter(team => sheetTitle.toLowerCase().includes(team));
                        const matchTeams = teamNames.filter(team => searchName.includes(team));
                        return sheetTeams.some(team => matchTeams.includes(team));
                    }
                ];
                
                for (const strategy of matchingStrategies) {
                    for (const sheet of sheets) {
                        const sheetTitle = sheet.properties.title;
                        
                        if (sheetTitle.toLowerCase().includes('dashboard') || 
                            sheetTitle.toLowerCase().includes('summary')) {
                            continue;
                        }
                        
                        if (strategy(sheetTitle)) {
                            matchSheetName = sheetTitle;
                            console.log(`✅ Found match using strategy: "${sheetTitle}"`);
                            break;
                        }
                    }
                    if (matchSheetName) break;
                }
                
                if (!matchSheetName) {
                    console.log(`⚠️ No direct match found, trying first available sheet...`);
                    for (const sheet of sheets) {
                        const sheetTitle = sheet.properties.title.toLowerCase();
                        if (!sheetTitle.includes('dashboard') && !sheetTitle.includes('summary')) {
                            matchSheetName = sheet.properties.title;
                            console.log(`📄 Using first available sheet: "${matchSheetName}"`);
                            break;
                        }
                    }
                }
                
                if (!matchSheetName) {
                    throw new Error(`No suitable sheet found. Available sheets: ${sheets.map(s => s.properties.title).join(', ')}`);
                }
                
                console.log(`📊 Loading data from sheet: "${matchSheetName}"`);
                
                const range = `'${matchSheetName}'!A1:L100`;
                const sheetData = await fastFetch(
                    `https://sheets.googleapis.com/v4/spreadsheets/${sheetId}/values/${range}?key=${API_KEY}&valueRenderOption=UNFORMATTED_VALUE&dateTimeRenderOption=FORMATTED_STRING`,
                    6000,
                    2
                );
                
                if (!sheetData || !sheetData.values || sheetData.values.length === 0) {
                    throw new Error(`No data found in sheet "${matchSheetName}"`);
                }
                
                return parseMatchSheetData(sheetData.values);
                
            } catch (error) {
                console.error('❌ Load match details error:', error);
                
                if (error.message.includes('HTTP 429')) {
                    throw new Error('Too many requests. Please wait a moment and try again.');
                } else if (error.message.includes('HTTP 403')) {
                    throw new Error('Access denied to this sheet. Please check permissions.');
                } else if (error.message.includes('HTTP 404')) {
                    throw new Error('Sheet not found. It may have been moved or deleted.');
                } else if (error.message.includes('timeout') || error.message.includes('fetch')) {
                    throw new Error('Connection timeout. Please check your internet and try again.');
                } else {
                    throw new Error(`Failed to load match details: ${error.message}`);
                }
            }
        }

        // ---- Faster loading ----
        // Each club sheet is read with ONE request (title + DASHBOARD values together) and
        // several sheets load at the same time. Every sheet is still loaded in full.
        const LOAD_CONCURRENCY = 6;
        const DASH_FIELDS = 'properties.title,sheets.data.rowData.values(formattedValue,effectiveValue,effectiveFormat.numberFormat.type)';

        // Turn a grid cell into the same value the values API gives with
        // UNFORMATTED_VALUE + dateTimeRenderOption=FORMATTED_STRING
        function cellValue(c) {
            if (!c) return '';
            const ev = c.effectiveValue;
            const nf = c.effectiveFormat && c.effectiveFormat.numberFormat && c.effectiveFormat.numberFormat.type;
            if (ev && ev.numberValue !== undefined) {
                if (nf === 'DATE' || nf === 'DATE_TIME' || nf === 'TIME') return c.formattedValue != null ? c.formattedValue : '';
                return ev.numberValue;
            }
            if (ev && ev.boolValue !== undefined) return ev.boolValue;
            if (ev && ev.stringValue !== undefined) return ev.stringValue;
            return c.formattedValue != null ? c.formattedValue : '';
        }

        async function fetchTeamDashboard(sheetId) {
            const url = `https://sheets.googleapis.com/v4/spreadsheets/${sheetId}?key=${API_KEY}` +
                `&includeGridData=true&ranges=${encodeURIComponent('DASHBOARD!A1:H50')}&fields=${encodeURIComponent(DASH_FIELDS)}`;
            const data = await fastFetch(url, 9000, 3);
            const sheet = (data.sheets || [])[0] || {};
            const grid = (sheet.data || [])[0] || {};
            const rows = (grid.rowData || []).map(r => (r.values || []).map(cellValue));
            // drop trailing empty cells/rows like the values API does
            rows.forEach(r => { while (r.length && (r[r.length - 1] === '' || r[r.length - 1] == null)) r.pop(); });
            while (rows.length && !rows[rows.length - 1].length) rows.pop();
            return { title: data.properties.title, rows };
        }

        async function loadOneSheet(sheetId, i) {
            let sheetName = `Sheet ${i + 1}`;
            try {
                let res;
                try {
                    res = await fetchTeamDashboard(sheetId);
                } catch (err) {
                    // e.g. no DASHBOARD tab (HTTP 400) — still learn the sheet's name for the report
                    try {
                        const info = await fastFetch(`https://sheets.googleapis.com/v4/spreadsheets/${sheetId}?key=${API_KEY}&fields=properties.title`, 5000, 1);
                        sheetName = info.properties.title;
                    } catch (e2) {}
                    throw err;
                }
                sheetName = res.title;
                if (!res.rows.length) return { kind: 'empty', name: sheetName };
                const teamData = parseSheetData(res.rows, 'DASHBOARD', res.title);
                if (teamData && teamData.totalTickets > 0) {
                    teamSheetCache.set(teamData.name, sheetId);
                    return { kind: 'ok', team: teamData };
                }
                return { kind: 'empty', name: sheetName };
            } catch (error) {
                console.log(`❌ Error processing sheet ${i + 1}: ${error.message}`);
                const m = error.message || '';
                if (m.includes('HTTP') || m.includes('timeout') || m.includes('fetch') || m.includes('abort') ||
                    m.includes('403') || m.includes('429') || m.includes('404')) {
                    return { kind: 'error', name: sheetName, id: sheetId, reason: m };
                }
                return { kind: 'empty', name: sheetName };
            }
        }

        async function refreshData() {
            // Saved data stays on screen while the fresh copy loads
            clearAllStatusMessages();
            setLoading(true);
            const started = Date.now();

            try {
                await loadClubList(); // refresh the club list from the master (single source of truth)

                const ids = SHEET_IDS.slice();
                const results = new Array(ids.length);
                let next = 0, done = 0;
                setProgress(0, ids.length);
                const lane = async () => {
                    while (next < ids.length) {
                        const i = next++;
                        results[i] = await loadOneSheet(ids[i], i);
                        done++;
                        setProgress(done, ids.length);
                    }
                };
                await Promise.all(Array.from({ length: Math.min(LOAD_CONCURRENCY, ids.length) }, lane));

                const allTeams = results.filter(r => r.kind === 'ok').map(r => r.team);
                const emptySheets = results.filter(r => r.kind === 'empty').map(r => r.name);
                const errorSheets = results.filter(r => r.kind === 'error');

                console.log(`📊 Loaded ${allTeams.length} teams in ${((Date.now() - started) / 1000).toFixed(1)}s ` +
                    `(${emptySheets.length} empty, ${errorSheets.length} errors)`);

                if (allTeams.length === 0 && errorSheets.length === ids.length) {
                    throw new Error(`No teams loaded successfully. All ${ids.length} sheets had errors. Please check your internet connection and try again.`);
                }

                dashboardData = {
                    teams: allTeams,
                    totalTickets: allTeams.reduce((sum, team) => sum + team.totalTickets, 0),
                    totalSpent: allTeams.reduce((sum, team) => sum + team.totalSpent, 0),
                    totalSales: allTeams.reduce((sum, team) => sum + team.totalSales, 0),
                    netProfit: allTeams.reduce((sum, team) => sum + team.netProfit, 0),
                    availableTickets: allTeams.reduce((sum, team) => sum + team.matches.reduce((s, m) => s + m.tickets, 0), 0)
                };

                lastUpdated = new Date();
                updateDashboard();
                saveCache();

                let successMessage = `Loaded ${allTeams.length} teams`;
                if (errorSheets.length > 0) {
                    showStatusMessage(successMessage, 'success', true);
                    const errorList = errorSheets.map(f => `• ${esc(f.name)}: ${esc(f.reason)}`).join('<br>');
                    showStatusMessage(`<b>${errorSheets.length} sheet${errorSheets.length === 1 ? '' : 's'} couldn’t load</b><br>${errorList}`, 'error', true);
                } else {
                    if (emptySheets.length > 0) successMessage += ` · ${emptySheets.length} with no data yet`;
                    showStatusMessage(successMessage, 'success', true);
                }
            } catch (error) {
                console.error('❌ Critical error during refresh:', error);
                showStatusMessage(`<b>Couldn’t refresh</b><br>${esc(error.message)}`, 'error', true);
            } finally {
                setLoading(false);
                if (!hasData()) renderHome();
            }
        }


        // Season 2026–27: August 2026 – July 2027
        function getSeasonMonths() {
            const out = [];
            for (let i = 0; i < 12; i++) {
                const m = (7 + i) % 12;
                const y = SEASON_START + (7 + i >= 12 ? 1 : 0);
                out.push({ value: `${y}-${String(m + 1).padStart(2, '0')}`, label: `${MON_LONG[m]} ${y}`, short: `${MON[m]} ${String(y).slice(2)}` });
            }
            return out;
        }

        function filterMatchesByMonth(matches, monthValue) {
            const [year, month] = monthValue.split('-');
            return matches.filter(match => {
                const [day, matchMonth, matchYear] = match.date.split('/');
                const paddedMonth = matchMonth.padStart(2, '0');
                return matchYear === year && paddedMonth === month;
            });
        }

function parseDMY(s) {
  if (!s) return null;

  const n = daysFromToday(d);
  if (n === 0) return 'Today';

  if (n === -1) return 'Yesterday';

  const n = String(name || '').toLowerCase();
  for (const [key, code, bg, fg] of CLUB_BADGES) {
    const re = new RegExp('(^|[^a-z])' + key.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '([^a-z]|$)');

  let h = 0; for (const c of n) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  return { code, bg: FALLBACK_COLS[h % FALLBACK_COLS.length], fg: '#FFFFFF' };

    <circle cx="34" cy="34" r="${r}" fill="none" stroke="var(--green)" stroke-width="8" stroke-linecap="round" stroke-dasharray="${d.toFixed(1)} ${c.toFixed(1)}"></circle></svg><b>${pct}%</b></div>`;
}

function renderHome() {
  const D = dashboardData, loaded = hasData();
  const total = D.totalTickets, avail = D.availableTickets, sold = Math.max(0, total - avail);
  const pct = total ? Math.round((sold / total) * 100) : 0;
  const dash = loaded ? null : '—';

  // mini bars: the last 6 season months up to now
  const nowKey = `${new Date().getFullYear()}-${String(new Date().getMonth() + 1).padStart(2, '0')}`;
  const months = monthlyStats().filter((m) => m.value <= nowKey).slice(-6);
  const max = Math.max(1, ...months.map((m) => Math.abs(m.profit)));
  const bars = (months.length ? months : Array.from({ length: 6 }, () => ({ profit: 0 }))).map((m) =>
    `<i style="height:${m.profit ? Math.max(6, Math.round(Math.abs(m.profit) / max * 44)) : 6}px;${m.profit ? `background:${pcol(m.profit)}` : ''}"></i>`).join('');

  // still to sell in the next 7 days
  const soon = allMatches().filter((x) => x.d && isWithinPeriod(x.m.date, 7) && x.m.tickets > 0).sort((a, b) => a.d - b.d);
  let soonHTML;
  if (!loaded) soonHTML = `<div class="empty">${document.body.classList.contains('loading') ? 'Loading your sheets…' : 'No data yet — tap refresh to load your sheets.'}</div>`;
  else if (!soon.length) soonHTML = `<div class="row plain"><span class="tile" style="--c:var(--green)">${ic('check', 17, 2.6)}</span><div class="main"><div class="t">All sold</div><div class="s">Nothing left to sell in the next 7 days</div></div></div>`;
  else soonHTML = soon.map((x) => `<button class="row" onclick="openMatchRef(${reg(x.team.name, x.m)})">${badge(x.team.name)}<div class="main"><div class="t">${esc(formatMatchName(x.m.name))}</div><div class="s">${dayShort(x.d)} · ${relDay(x.d)}</div>${soldLine(x.m)}</div>${availRight(x.m)}${chev()}</button>`).join('');

  $('homeBody').innerHTML = `
    <div class="shead"><h2>Season ${SEASON_LABEL}</h2></div>
    <button class="card cardpad press" onclick="switchTab('matches')" aria-label="Tickets: ${sold} sold, ${avail} available of ${total}">
      ${chead('ticket', 'blue', 'Tickets', updatedLabel())}
      <div class="split">${cols([['Sold', 'green', dash || sold], ['Available', 'orange', dash || avail], ['Total', 'blue', dash || total]])}${ringSVG(pct)}</div>
    </button>
    <button class="card cardpad press" onclick="switchTab('reports')" aria-label="Net profit ${loaded ? signed(D.netProfit) : 'not loaded'}">
      ${chead('trend', 'green', 'Net Profit', 'Season')}
      <div class="split"><div><div class="big" ${loaded && D.netProfit < 0 ? 'style="color:var(--red)"' : ''}>${loaded ? signed(D.netProfit) : '—'}</div>
      <div class="muted">${loaded ? `${formatCurrency(D.totalSales)} sales · ${formatCurrency(D.totalSpent)} spent` : 'Sales and spend appear here'}</div></div>
      <div class="minibars" aria-hidden="true">${bars}</div></div>
    </button>
    <div class="shead"><span class="ic" style="color:var(--orange)">${ic('alert', 21, 2.3)}</span><h2>Still to Sell</h2><button class="link" onclick="setUpcomingPeriod(7);switchTab('matches')">Next 7 days</button></div>
    <div class="list">${soonHTML}</div>`;
}

function setUpcomingPeriod(days) {
  selectedUpcomingPeriod = days;
  document.querySelectorAll('#periodSeg button').forEach((b) => b.setAttribute('aria-pressed', String(+b.dataset.days === days)));
  renderMatches();
}
function setMatchFilter(f) { matchFilter = f; closeMenus(); renderMatches(); }
function setMatchQuery(q) { matchQuery = q; renderMatches(); }

function matchRow(x, showDate) {
  const sub = showDate ? `${dayShort(x.d)} · ${esc(x.team.name)}` : esc(x.team.name);
  return `<button class="row" onclick="openMatchRef(${reg(x.team.name, x.m)})">${badge(x.team.name)}<div class="main"><div class="t">${esc(formatMatchName(x.m.name))}</div><div class="s">${sub}</div>${soldLine(x.m)}</div>${availRight(x.m)}${chev()}</button>`;
}
function renderMatches() {
  const q = matchQuery.trim().toLowerCase();
  let items = allMatches().filter((x) => x.d);
  if (q) items = items.filter((x) => (x.m.name + ' ' + x.team.name).toLowerCase().includes(q));
  else items = items.filter((x) => isWithinPeriod(x.m.date, selectedUpcomingPeriod));
  if (matchFilter === 'unsold') items = items.filter((x) => x.m.tickets > 0);
  if (matchFilter === 'soldout') items = items.filter((x) => x.m.tickets === 0);
  items.sort((a, b) => a.d - b.d || a.team.name.localeCompare(b.team.name));

  const filterName = { all: '', unsold: ' · unsold', soldout: ' · sold out' }[matchFilter];
  $('matchesSub').textContent = q ? `${plural(items.length, 'result')}${filterName}` : `Next ${selectedUpcomingPeriod} days · ${plural(items.length, 'match')}${filterName}`;
  $('periodSeg').classList.toggle('hidden', !!q);
  $('filterBtn').classList.toggle('on', matchFilter !== 'all');
  $('filterMenu').innerHTML = [['all', 'All matches'], ['unsold', 'Unsold'], ['soldout', 'Sold out']].map(([k, l]) =>
    `<button role="menuitemradio" aria-checked="${matchFilter === k}" onclick="setMatchFilter('${k}')"><span>${l}</span><span class="tick">${matchFilter === k ? ic('check', 18, 2.6) : ''}</span></button>`).join('');

  const box = $('upcomingMatches');
  if (!hasData()) { box.innerHTML = `<div class="card empty">No data yet.</div>`; return; }
  if (!items.length) {
    box.innerHTML = `<div class="card empty">${q ? 'No matches found.' : `No matches in the next ${selectedUpcomingPeriod} days.`}</div>`;
    return;
  }
  if (q) { box.innerHTML = `<div class="list">${items.map((x) => matchRow(x, true)).join('')}</div>`; return; }
  const groups = [];
  items.forEach((x) => {
    const key = x.m.date;
    if (!groups.length || groups[groups.length - 1].key !== key) groups.push({ key, d: x.d, rows: [] });
    groups[groups.length - 1].rows.push(x);
  });
  box.innerHTML = groups.map((g) => `<div class="day">${dayLong(g.d)}</div><div class="list">${g.rows.map((x) => matchRow(x, false)).join('')}</div>`).join('');
}

function setTeamSort(s) {

function teamLeft(t) { return t.matches.reduce((s, m) => s + m.tickets, 0); }

function updateTeamsSections() {
  const all = dashboardData.teams;
  $('teamsSub').textContent = hasData() ? `${plural(all.length, 'team')} · ${dashboardData.totalTickets} tickets` : ' ';
  const q = teamQuery.trim().toLowerCase();
  let teams = all.filter((t) => !q || t.name.toLowerCase().includes(q));
  if (teamSort === 'profit') teams.sort((a, b) => b.netProfit - a.netProfit);
  else if (teamSort === 'left') teams.sort((a, b) => teamLeft(b) - teamLeft(a) || a.name.localeCompare(b.name));
  else teams.sort((a, b) => a.name.localeCompare(b.name));
  window.sortedTeams = teams;
  const box = $('teamsContainer');
  if (!hasData()) { box.innerHTML = `<div class="card empty">No data yet.</div>`; return; }

  const max = Math.max(1, ...teams.map((t) => Math.abs(t.netProfit)));
  box.innerHTML = `<div class="list">${teams.map((t, i) => {
    const right = teamSort === 'left'
      ? `<span class="num" style="font-size:17px;font-weight:600;color:${teamLeft(t) ? 'var(--orange)' : 'var(--green)'}">${teamLeft(t) ? teamLeft(t) + ' left' : 'All sold'}</span>`

  }).join('')}</div>`;
}

function toggleSearch(which) {

function toggleMenu(id) { const m = $(id); const show = !m.classList.contains('show'); closeMenus(); m.classList.toggle('show', show); }

/* ---------- Sheets ---------- */
function openLayer(id) { const l = $(id); l.classList.add('open'); l.querySelector('.sheet-body').scrollTop = 0; }
function closeLayer(id) { $(id).classList.remove('open'); }
function attachSheetDrag(layerId, close) {
  const layer = $(layerId), sheet = layer.querySelector('.sheet'), head = layer.querySelector('.sheet-head');
  let y0 = null, dy = 0;
  head.addEventListener('pointerdown', (e) => { if (e.target.closest('button')) return; y0 = e.clientY; dy = 0; sheet.classList.add('dragging'); head.setPointerCapture(e.pointerId); });
  head.addEventListener('pointermove', (e) => { if (y0 === null) return; dy = Math.max(0, e.clientY - y0); sheet.style.transform = `translateY(${dy}px)`; });
  const end = () => {
    if (y0 === null) return;
    sheet.classList.remove('dragging'); sheet.style.transform = ''; y0 = null;
    if (dy > 110) close();
  };
  head.addEventListener('pointerup', end); head.addEventListener('pointercancel', end);
}
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  if ($('matchPopupOverlay').classList.contains('open')) closeMatchPopup();
  else if ($('pdfExportModal').classList.contains('open')) closePDFExportModal();
  else closeMenus();
});

/* ---------- Toast & status ---------- */
let toastTimer = null;
function toast(msg, actionLabel, action, ms = 3200) {
  const t = $('toast');
  t.innerHTML = `<span>${esc(msg)}</span>${actionLabel ? `<button>${esc(actionLabel)}</button>` : ''}`;
  if (actionLabel) t.querySelector('button').onclick = () => { t.classList.remove('show'); action(); };
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), ms);
}
function showStatusMessage(message, type = 'success', persistent = false) {
  const id = 'status-' + Date.now() + Math.random().toString(36).slice(2, 6);
  if (type !== 'error') { toast(message.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim()); return id; }
  const el = document.createElement('button');
  el.id = id; el.className = 'card banner';
  el.innerHTML = `<span class="ic">${ic('alert', 20, 2.3)}</span><div>${message}<small>Tap to dismiss</small></div>`;
  el.onclick = () => dismissStatusMessage(id);
  $('statusMessages').appendChild(el);
  return id;
}
function dismissStatusMessage(id) { const m = $(id); if (m) m.remove(); }
function clearAllStatusMessages() { $('statusMessages').innerHTML = ''; }
function setLoading(on) {
  document.body.classList.toggle('loading', on);
  const b = $('refreshBtn'); b.classList.toggle('spin', on); b.disabled = on;
  if (on) setProgress(0, SHEET_IDS.length);
  if (!hasData()) renderHome();
}
function setProgress(i, n) {
  $('progressBar').style.width = `${n ? Math.round(i / n * 100) : 0}%`;
  $('progressText').textContent = i ? `Loading ${i} of ${n} sheets…` : 'Loading club list…';
}

/* ---------- Clipboard / share ---------- */
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch (e) {
    const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand('copy'); } catch (e2) {}
    ta.remove(); return ok;
  }
}
function seatLabel(t, i) {
  const parts = [t.block && `Block ${t.block}`, t.row && `Row ${t.row}`, t.seat && `Seat ${t.seat}`].filter(Boolean);
  return parts.length ? parts.join(' · ') : `Ticket ${i + 1}`;
}

/* ---------- Theme ---------- */
function getThemePref() { try { return localStorage.getItem('theme'); } catch (e) { return null; } }
function effectiveDark() {
  const p = getThemePref();
  if (p === 'dark') return true;
  if (p === 'light') return false;
  return window.matchMedia('(prefers-color-scheme: dark)').matches;
}
function setTheme(pref) {
  if (pref === 'light' || pref === 'dark') document.documentElement.setAttribute('data-theme', pref);
  else document.documentElement.removeAttribute('data-theme');
  $('themeColor').setAttribute('content', effectiveDark() ? '#000000' : '#F2F2F7');
}
function setThemePref(p) {
  try { if (p === 'auto') localStorage.removeItem('theme'); else localStorage.setItem('theme', p); } catch (e) {}
  setTheme(p);
  renderReports();
}
function toggleTheme() { setThemePref(effectiveDark() ? 'light' : 'dark'); }
setTheme(getThemePref());
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => setTheme(getThemePref()));

/* ---------- Saved data (instant open + offline) ---------- */
function saveCache() {
  try {
    localStorage.setItem(CACHE_KEY, JSON.stringify({ data: dashboardData, at: lastUpdated ? lastUpdated.getTime() : Date.now(), ids: [...teamSheetCache.entries()] }));
  } catch (e) {}
}
function loadCache() {
  try {
    const raw = localStorage.getItem(CACHE_KEY);
    if (!raw) return false;
    const c = JSON.parse(raw);
    if (!c || !c.data || !Array.isArray(c.data.teams)) return false;
    dashboardData = c.data;
    lastUpdated = c.at ? new Date(c.at) : null;
    (c.ids || []).forEach(([k, v]) => teamSheetCache.set(k, v));
    return true;
  } catch (e) { return false; }
}

      matchLoading('Finding team sheet…');
      teamSheetId = await findTeamSheetId(teamName);
      if (teamSheetId) teamSheetCache.set(teamName, teamSheetId);
    }
    if (!teamSheetId) throw new Error(`Could not find spreadsheet for team "${teamName}". The team may not have a dedicated sheet yet.`);
    matchLoading('Loading match data…');
    const matchData = await loadMatchDetails(teamSheetId, matchName);
    if (lastMatchArgs[1] !== matchName) return; // another match was opened meanwhile
    displayMatchDetails(matchData, matchName);
  } catch (error) {
    console.error('❌ Error loading match details:', error);
    $('matchPopupContent').innerHTML = `<div class="loading-box"><span style="color:var(--red)">${ic('alert', 32, 2)}</span>
      <div style="color:var(--label);max-width:300px">${esc(error.message)}</div>
      <button class="btn-small press" onclick="retryMatch()">Try Again</button>
      <div style="font-size:13px;max-width:300px">If this continues, the match sheet may not exist yet or there may be a connection issue.</div></div>`;
  }
}
function retryMatch() { if (lastMatchArgs) openMatchPopup(...lastMatchArgs); }
function closeMatchPopup(event) {
  if (event && event.target !== event.currentTarget) return;
  closeLayer('matchPopupOverlay');
}
function displayMatchDetails(matchData, matchName) {
  const { tickets, summary } = matchData;
  currentMatch = { name: formatMatchName(matchName), date: lastMatchArgs ? lastMatchArgs[2] : '', tickets, summary };
  $('matchShareBtn').disabled = false;
  const total = summary.totalTickets, sold = summary.soldTickets, avail = summary.availableTickets;
  const segs = total && total <= 30
    ? `<div class="segs" aria-hidden="true">${tickets.map((t) => `<i${t.status === 'Sold' ? ' style="background:var(--green)"' : ''}></i>`).sort((a, b) => b.length - a.length).join('')}</div>`
    : `<div class="bar" style="height:8px;margin-top:0" aria-hidden="true"><i style="width:${total ? Math.round(sold / total * 100) : 0}%;background:var(--green)"></i></div>`;
  const availT = tickets.map((t, i) => ({ t, i })).filter((x) => x.t.status !== 'Sold');
  const soldT = tickets.map((t, i) => ({ t, i })).filter((x) => x.t.status === 'Sold');
  $('matchPopupContent').innerHTML = `
    <div class="card cardpad">
      ${chead('trend', summary.profit >= 0 ? 'green' : 'red', 'Profit', `${sold} of ${total} sold`, false)}
      <div class="big" ${summary.profit < 0 ? 'style="color:var(--red)"' : ''}>${signed(summary.profit)}</div>
      ${segs}
      ${cols([['Sold', 'green', String(sold)], ['Available', 'orange', String(avail)], ['Total FV', 'blue', formatCurrency(summary.totalFV)], ['Sales', 'indigo', formatCurrency(summary.totalSales)]], true)}
    </div>
    ${availT.length ? `<div class="shead" style="padding-top:2px"><h2 style="font-size:20px">Available</h2><button class="link press" onclick="copySeats()">${ic('copy', 16, 2.2)}Copy</button></div>
    <div class="list">${availT.map(({ t, i }) => `<div class="row plain" style="min-height:50px"><span class="main t num">${esc(seatLabel(t, i))}</span><span class="v num">FV ${formatCurrency(t.fv)}</span></div>`).join('')}</div>` : ''}
    ${soldT.length ? `<div class="shead" style="padding-top:2px"><h2 style="font-size:20px">Sold</h2><span class="r">${soldT.length}</span></div>
    <div class="list">${soldT.map(({ t, i }) => `<div class="row plain" style="min-height:54px"><span class="main t num">${esc(seatLabel(t, i))}</span><div class="right num"><b style="color:var(--green)">${formatCurrency(t.soldFor)}</b><small>FV ${formatCurrency(t.fv)}</small></div></div>`).join('')}</div>` : ''}`;
}
function seatsText(list) { return list.map(({ t, i }) => `${seatLabel(t, i)} (FV ${formatCurrency(t.fv)})`).join('\n'); }
async function copySeats() {
  if (!currentMatch) return;
  const list = currentMatch.tickets.map((t, i) => ({ t, i })).filter((x) => x.t.status !== 'Sold');
  const d = parseDMY(currentMatch.date);
  const ok = await copyText(`${currentMatch.name}${d ? ' – ' + dayShort(d) : ''}\n${seatsText(list)}`);
  toast(ok ? `Copied ${plural(list.length, 'seat')}` : 'Couldn’t copy');
}
async function shareMatch() {
  if (!currentMatch) return;
  const s = currentMatch.summary, d = parseDMY(currentMatch.date);
  const list = currentMatch.tickets.map((t, i) => ({ t, i })).filter((x) => x.t.status !== 'Sold');
  const text = `${currentMatch.name}${d ? ' – ' + dayShort(d) : ''}\nSold ${s.soldTickets} of ${s.totalTickets} · Profit ${signed(s.profit)}` +
    (list.length ? `\n\nAvailable:\n${seatsText(list)}` : '');
  if (navigator.share) { try { await navigator.share({ title: currentMatch.name, text }); return; } catch (e) { if (e && e.name === 'AbortError') return; } }
  toast((await copyText(text)) ? 'Summary copied' : 'Couldn’t share');
}

/* =====================================================================
   PDF export sheets (generation code below is unchanged)
   ===================================================================== */
function pdfReady() {
  if (window.jspdf && window.jspdf.jsPDF) return true;
  toast('PDF tools still loading — check your connection');
  return false;
}
function needData() { if (hasData()) return true; toast('Load your data first', 'Refresh', refreshDashboard); return false; }
function showPDFExportModal() { switchTab('reports'); }
function closePDFExportModal(event) {
  if (event && event.target !== event.currentTarget) return;
  closeLayer('pdfExportModal');
}
function runPDF(label, fn) {
  if (!needData() || !pdfReady()) return;
  toast(`Creating ${label}…`);
  setTimeout(() => {
    try { fn(); closePDFExportModal(); toast(`${label} saved`); }
    catch (e) { console.error(e); toast('Couldn’t create the PDF'); }
  }, 350);
}
function exportAllDataPDF() { runPDF('All Teams PDF', generateAllTeamsPDF); }
function exportTeamPDF(teamName) { runPDF(`${teamName} PDF`, () => generateTeamPDF(teamName)); }

let selectedMonth = null;
function showMonthlyReportOptions() {
  if (!needData()) return;
  selectedMonth = null;
  $('exportTitle').textContent = 'Monthly Report';
  $('exportSub').textContent = 'Choose a month';
  renderMonthly();
  openLayer('pdfExportModal');
}
function renderMonthly() {
  const stats = monthlyStats();
  const sel = stats.find((m) => m.value === selectedMonth);
  $('pdfExportContent').innerHTML = `
    <div class="months">${stats.map((m) => `<button class="press" aria-pressed="${m.value === selectedMonth}" onclick="selectMonth('${m.value}')">${m.short.split(' ')[0]}</button>`).join('')}</div>
    ${sel ? `<div class="list">
      <div class="row plain" style="min-height:48px"><span class="main t">Matches</span><span class="v num">${sel.count}</span></div>
      <div class="row plain" style="min-height:48px"><span class="main t">Tickets</span><span class="v num">${sel.tickets}</span></div>
      <div class="row plain" style="min-height:48px"><span class="main t">Profit</span><span class="v num" style="color:${pcol(sel.profit)};font-weight:600">${signed(sel.profit)}</span></div></div>` : ''}
    <button class="btn-primary press" onclick="generateMonthlyReport()" id="generateMonthlyBtn" ${sel ? '' : 'disabled'}>${ic('doc', 19, 2)}${sel ? `Export ${sel.label.split(' ')[0]} PDF` : 'Select a month'}</button>`;
}
function selectMonth(monthValue) { selectedMonth = monthValue; renderMonthly(); }
function generateMonthlyReport() {
  if (!selectedMonth) { toast('Select a month first'); return; }
  const label = getSeasonMonths().find((m) => m.value === selectedMonth).label;
  runPDF(`${label} report`, () => generateMonthlyPDF(selectedMonth));
}
function showTeamExportOptions() {
  if (!needData()) return;
  $('exportTitle').textContent = 'Single Team';
  $('exportSub').textContent = 'Choose a team to export';
  const teams = [...dashboardData.teams].sort((a, b) => a.name.localeCompare(b.name));
  $('pdfExportContent').innerHTML = `<div class="list">${teams.map((t, i) =>
    `<button class="row" onclick="exportTeamPDF(window._exportTeams[${i}])">${badge(t.name)}<div class="main"><div class="t">${esc(t.name)}</div><div class="s">${t.totalTickets} tickets · ${formatCurrency(t.totalSpent)} spent</div></div><span style="color:var(--blue);display:flex">${ic('doc', 19, 2)}</span></button>`).join('')}</div>`;
  window._exportTeams = teams.map((t) => t.name);
  openLayer('pdfExportModal');
}

/* =====================================================================
   App lifecycle
   ===================================================================== */
function refreshDashboard() {
  if (document.body.classList.contains('loading')) return;
  refreshData();
}

/* ---- Auto-update (same as Salah Times) ----
   1) sw.js is re-checked every time the app is opened or brought back to the front.
      If it changed, the new worker takes over and the page reloads itself once.
   2) index.html is fetched network-first by the service worker, and when the app is
      resumed we compare the server's ETag / Last-Modified, so HTML-only edits show
      up without touching sw.js. */
if ('serviceWorker' in navigator) {
  let hasController = !!navigator.serviceWorker.controller;
  let reloading = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!hasController) { hasController = true; return; } // first install: no reload needed
    if (reloading) return;
    reloading = true;
    location.reload();
  });
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' }).then((reg) => {
      const activate = (w) => { if (w && navigator.serviceWorker.controller) w.postMessage({ type: 'SKIP_WAITING' }); };
      if (reg.waiting) activate(reg.waiting);
      reg.addEventListener('updatefound', () => {
        const w = reg.installing;
        if (w) w.addEventListener('statechange', () => { if (w.state === 'installed') activate(w); });
      });
      const check = () => { if (navigator.onLine) reg.update().catch(() => {}); };
      check();
      setInterval(check, 15 * 60 * 1000);
      document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') check(); });
    }).catch((err) => console.warn('Service worker registration failed:', err));
  });
}
(() => {
  let stamp = null, lastCheck = 0;
  const readStamp = () => fetch('./index.html', { method: 'HEAD', cache: 'no-store' })
    .then((r) => r.ok ? (r.headers.get('ETag') || r.headers.get('Last-Modified')) : null)
    .catch(() => null);
  window.addEventListener('load', () => { readStamp().then((s) => { stamp = s; }); });
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'visible' || !navigator.onLine || !stamp) return;
    if (Date.now() - lastCheck < 30000) return;
    lastCheck = Date.now();
    readStamp().then((s) => { if (s && s !== stamp) location.reload(); });
  });
})();

window.addEventListener('online', () => {
  document.body.classList.remove('offline');
  toast('You’re back online', 'Refresh', refreshDashboard, 6000);
});
window.addEventListener('offline', () => { document.body.classList.add('offline'); });

let deferredPrompt;
const installBanner = $('installBanner');
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  let dismissed = false; try { dismissed = localStorage.getItem('installBannerDismissed') === 'true'; } catch (err) {}
  if (!dismissed && !window.matchMedia('(display-mode: standalone)').matches) installBanner.classList.add('show');
});
function installPWA() {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  deferredPrompt.userChoice.then(() => { deferredPrompt = null; hideInstallBanner(); });
}
function hideInstallBanner() {
  installBanner.classList.remove('show');
  try { localStorage.setItem('installBannerDismissed', 'true'); } catch (e) {}
}
window.addEventListener('appinstalled', hideInstallBanner);
setTimeout(() => { if (installBanner.classList.contains('show')) hideInstallBanner(); }, 30000);

/* ---------- Start ---------- */
(function init() {
  loadCache();
  updateDashboard();
  attachSheetDrag('matchPopupOverlay', closeMatchPopup);
  attachSheetDrag('pdfExportModal', closePDFExportModal);
  const hash = location.hash;
  if (hash) history.replaceState(null, '', location.pathname + location.search);
  if (hash === '#upcoming') switchTab('matches');
  updateTopColour();
  if (navigator.onLine) refreshData();
  else document.body.classList.add('offline');
})();

</script>
